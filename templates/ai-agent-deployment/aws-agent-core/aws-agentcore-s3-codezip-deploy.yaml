template:
  name: ADK Deployment to AWS AgentCore
  identifier: ADK_Deployment_to_AWS_AgentCore
  versionLabel: v2
  type: Pipeline
  projectIdentifier: akshitdevrelharness
  orgIdentifier: default
  tags:
    framework: google-adk
    runtime: aws-agentcore
    deploy: s3-direct-code
  spec:
    stages:
      - stage:
          name: Build and Deploy
          identifier: deploy_and_verify
          type: CI
          description: Clones the agent source, packages it as an arm64 zip, uploads it to S3, and deploys it to Amazon Bedrock AgentCore Runtime using direct code deployment.
          spec:
            cloneCodebase: false
            platform:
              os: Linux
              arch: Amd64
            runtime:
              type: Cloud
              spec: {}
            execution:
              steps:
                - step:
                    type: GitClone
                    name: Git Clone
                    identifier: git_clone
                    spec:
                      connectorRef: <+pipeline.variables.gitConnectorRef>
                      repoName: <+pipeline.variables.repoName>
                      build:
                        type: branch
                        spec:
                          branch: <+pipeline.variables.gitBranch>
                - step:
                    name: Validate Agent Project
                    identifier: validate_project
                    type: Run
                    spec:
                      shell: Sh
                      envVariables:
                        REPO_NAME: <+pipeline.variables.repoName>
                        AGENT_SUB_PATH: <+pipeline.variables.agentSubPath>
                        ENTRYPOINT: <+pipeline.variables.entrypoint>
                      command: |
                        set -eu

                        # GitClone lands the repo either at /harness/<repoName> or
                        # directly in /harness depending on the clone settings.
                        if [ -d "/harness/$REPO_NAME" ]; then
                          REPO_ROOT="/harness/$REPO_NAME"
                        else
                          REPO_ROOT="/harness"
                        fi

                        if [ "$AGENT_SUB_PATH" = "." ] || [ -z "$AGENT_SUB_PATH" ]; then
                          AGENT_DIR="$REPO_ROOT"
                        else
                          AGENT_DIR="$REPO_ROOT/$AGENT_SUB_PATH"
                        fi

                        echo "==> Agent directory: $AGENT_DIR"
                        if [ ! -d "$AGENT_DIR" ]; then
                          echo "ERROR: agentSubPath '$AGENT_SUB_PATH' does not exist in the repo."
                          echo "Repo contents:"
                          ls -la "$REPO_ROOT"
                          exit 1
                        fi

                        cd "$AGENT_DIR"
                        echo "==> Contents"
                        ls -la

                        # The entrypoint must sit at the top of the agent directory,
                        # because it has to land at the root of the zip.
                        if [ ! -f "$ENTRYPOINT" ]; then
                          echo "ERROR: entrypoint '$ENTRYPOINT' not found in $AGENT_DIR."
                          echo "AgentCore runs the entrypoint from the root of the archive,"
                          echo "so it must be at the top level of the agent directory."
                          exit 1
                        fi
                        echo "  OK: $ENTRYPOINT"

                        # Dependencies have to be declared somewhere we can install from.
                        if [ -f "pyproject.toml" ]; then
                          echo "  OK: pyproject.toml (dependency source)"
                        elif [ -f "requirements.txt" ]; then
                          echo "  OK: requirements.txt (dependency source)"
                        else
                          echo "ERROR: neither pyproject.toml nor requirements.txt found."
                          echo "AgentCore does not install dependencies for you; they must be"
                          echo "installed into the zip, so the pipeline needs a manifest."
                          exit 1
                        fi

                        # AgentCore Runtime contract: either the SDK annotation or the
                        # two HTTP endpoints. Without one of these the runtime deploys
                        # and then fails health checks.
                        if grep -q "@app.entrypoint" "$ENTRYPOINT"; then
                          echo "  OK: uses @app.entrypoint from the bedrock-agentcore SDK"
                        elif grep -q "/invocations" "$ENTRYPOINT" && grep -q "/ping" "$ENTRYPOINT"; then
                          echo "  OK: implements POST /invocations and GET /ping"
                        else
                          echo "ERROR: $ENTRYPOINT does not satisfy the AgentCore Runtime contract."
                          echo "It must either use @app.entrypoint from the bedrock-agentcore SDK,"
                          echo "or serve POST /invocations and GET /ping on 0.0.0.0:8080."
                          echo "https://docs.aws.amazon.com/bedrock-agentcore/latest/devguide/runtime-service-contract.html"
                          exit 1
                        fi

                        if ! grep -q "8080" "$ENTRYPOINT"; then
                          echo "  note: no reference to port 8080 in $ENTRYPOINT."
                          echo "        AgentCore only talks to 8080 and does not fall back."
                        fi

                        echo "==> Validation passed"
                - step:
                    name: Package and Upload to S3
                    identifier: package_and_upload
                    type: Run
                    spec:
                      image: python:3.12-slim
                      shell: Bash
                      envVariables:
                        AWS_ACCESS_KEY_ID: <+secrets.getValue("aws_access_key_id")>
                        AWS_SECRET_ACCESS_KEY: <+secrets.getValue("aws_secret_access_key")>
                        AWS_SESSION_TOKEN: <+secrets.getValue("aws_session_token")>
                        AWS_DEFAULT_REGION: <+pipeline.variables.awsRegion>
                        AWS_ACCOUNT_ID: <+pipeline.variables.awsAccountId>
                        REPO_NAME: <+pipeline.variables.repoName>
                        AGENT_SUB_PATH: <+pipeline.variables.agentSubPath>
                        ENTRYPOINT: <+pipeline.variables.entrypoint>
                        PYTHON_RUNTIME: <+pipeline.variables.pythonRuntime>
                        CODE_BUCKET: <+pipeline.variables.codeBucket>
                        S3_KEY_PREFIX: <+pipeline.variables.s3KeyPrefix>
                        RUNTIME_NAME: <+pipeline.variables.runtimeName>
                        EXECUTION_ROLE_ARN: <+pipeline.variables.executionRoleArn>
                        BUILD_ID: <+pipeline.sequenceId>
                        CI: "true"
                      outputVariables:
                        - name: CODE_OBJECT_KEY
                          type: String
                          value: CODE_OBJECT_KEY
                        - name: ZIP_SIZE
                          type: String
                          value: ZIP_SIZE
                        - name: ZIP_SHA256
                          type: String
                          value: ZIP_SHA256
                      command: |
                        set -euo pipefail

                        # ── Normalize AWS credentials ────────────────────
                        # Secrets frequently carry a trailing newline, and an
                        # AKIA key paired with a session token is rejected with
                        # InvalidClientTokenId.
                        AWS_ACCESS_KEY_ID="$(printf '%s' "${AWS_ACCESS_KEY_ID:-}" | tr -d '[:space:]')"
                        AWS_SECRET_ACCESS_KEY="$(printf '%s' "${AWS_SECRET_ACCESS_KEY:-}" | tr -d '[:space:]')"
                        AWS_SESSION_TOKEN="$(printf '%s' "${AWS_SESSION_TOKEN:-}" | tr -d '[:space:]')"
                        export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY

                        echo "==> Credential shape"
                        echo "    access key : ${AWS_ACCESS_KEY_ID:0:4}... (${#AWS_ACCESS_KEY_ID} chars)"
                        echo "    secret key : ${#AWS_SECRET_ACCESS_KEY} chars"
                        echo "    session tok: ${#AWS_SESSION_TOKEN} chars"

                        case "$AWS_ACCESS_KEY_ID" in
                          ASIA*)
                            if [ -z "$AWS_SESSION_TOKEN" ]; then
                              echo "ERROR: an ASIA... key is temporary and requires aws_session_token."
                              exit 1
                            fi
                            export AWS_SESSION_TOKEN
                            ;;
                          AKIA*)
                            if [ -n "$AWS_SESSION_TOKEN" ]; then
                              echo "    note: AKIA keys are long-term and must not carry a session token; ignoring it."
                            fi
                            unset AWS_SESSION_TOKEN
                            ;;
                          "")
                            echo "ERROR: aws_access_key_id resolved to an empty string."
                            exit 1
                            ;;
                          *)
                            if [ -z "$AWS_SESSION_TOKEN" ]; then
                              unset AWS_SESSION_TOKEN
                            else
                              export AWS_SESSION_TOKEN
                            fi
                            ;;
                        esac

                        # ── Build tooling ────────────────────────────────
                        # 'file' is used to prove the native libraries are arm64.
                        apt-get update -qq
                        apt-get install -y --no-install-recommends zip file > /dev/null
                        pip install --quiet --root-user-action=ignore uv boto3
                        uv --version

                        # ── Locate the agent ─────────────────────────────
                        if [ -d "/harness/$REPO_NAME" ]; then
                          REPO_ROOT="/harness/$REPO_NAME"
                        else
                          REPO_ROOT="/harness"
                        fi
                        if [ "$AGENT_SUB_PATH" = "." ] || [ -z "$AGENT_SUB_PATH" ]; then
                          AGENT_DIR="$REPO_ROOT"
                        else
                          AGENT_DIR="$REPO_ROOT/$AGENT_SUB_PATH"
                        fi
                        cd "$AGENT_DIR"

                        # PYTHON_3_12 -> 3.12, so the wheels always match the
                        # runtime the agent is deployed onto.
                        PY_VERSION="$(printf '%s' "$PYTHON_RUNTIME" | sed 's/^PYTHON_//; s/_/./')"
                        echo "==> Target: Python $PY_VERSION on linux/arm64"

                        if [ -f "pyproject.toml" ]; then
                          MANIFEST="pyproject.toml"
                        else
                          MANIFEST="requirements.txt"
                        fi
                        echo "==> Installing dependencies from $MANIFEST"

                        # AgentCore Runtime is arm64-only, and nothing installs these
                        # for you at deploy time, so they are cross-installed here as
                        # aarch64 wheels. --only-binary=:all: makes a missing arm64
                        # wheel fail loudly instead of building an x86 one silently.
                        rm -rf deployment_package
                        uv pip install \
                          --python-platform aarch64-manylinux2014 \
                          --python-version "$PY_VERSION" \
                          --target=deployment_package \
                          --only-binary=:all: \
                          -r "$MANIFEST"

                        # ── Normalize the tree ───────────────────────────
                        find deployment_package -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
                        find deployment_package -name "*.pyc" -delete 2>/dev/null || true

                        # AgentCore needs 644 on files, 755 on dirs and executables.
                        find deployment_package -type d -exec chmod 755 {} +
                        find deployment_package -type f -exec chmod 644 {} +
                        find deployment_package -type f \( -name "*.so*" -o -path "*/bin/*" \) -exec chmod 755 {} +

                        echo "==> Verifying native libraries are aarch64"
                        if find deployment_package -name "*.so*" -type f -exec file {} \; | grep -v -i "aarch64\|ARM aarch64" | grep -q .; then
                          echo "ERROR: found native libraries that are not aarch64:"
                          find deployment_package -name "*.so*" -type f -exec file {} \; | grep -v -i "aarch64\|ARM aarch64"
                          echo "These deploy successfully and then fail at import inside the runtime."
                          exit 1
                        fi
                        echo "    all native libraries are aarch64"

                        # ── Assemble the archive ─────────────────────────
                        # Dependencies at the root, then the agent source at the
                        # root beside them. AgentCore mounts this at /var/task,
                        # which is first on sys.path.
                        ZIP_PATH="/tmp/deployment_package.zip"
                        rm -f "$ZIP_PATH"

                        (cd deployment_package && zip -qr "$ZIP_PATH" .)
                        zip -qr "$ZIP_PATH" . \
                          -x "deployment_package/*" \
                             ".git/*" \
                             ".venv/*" \
                             "venv/*" \
                             "*/__pycache__/*" \
                             "__pycache__/*" \
                             "*.pyc" \
                             "*.zip"

                        chmod 644 "$ZIP_PATH"
                        ls -lh "$ZIP_PATH"

                        # ── Verify and upload ────────────────────────────
                        cat > /tmp/package.py << 'PYEOF'
                        import hashlib
                        import os
                        import sys
                        import zipfile

                        import boto3
                        from botocore.exceptions import ClientError

                        zip_path = "/tmp/deployment_package.zip"
                        entrypoint = os.environ["ENTRYPOINT"]
                        bucket = os.environ["CODE_BUCKET"]
                        account_id = os.environ["AWS_ACCOUNT_ID"]
                        prefix = os.environ.get("S3_KEY_PREFIX", "").strip("/")
                        runtime_name = os.environ["RUNTIME_NAME"]
                        build_id = os.environ.get("BUILD_ID", "0")

                        # Documented AgentCore limits for a .zip deployment package.
                        MAX_ZIPPED = 250 * 1024 * 1024
                        MAX_UNZIPPED = 750 * 1024 * 1024

                        with zipfile.ZipFile(zip_path) as archive:
                            names = archive.namelist()
                            unzipped = sum(info.file_size for info in archive.infolist())

                        zipped = os.path.getsize(zip_path)
                        print(f"==> Archive: {len(names)} entries")
                        print(f"    zipped   : {zipped / 1048576:.1f} MB (limit 250 MB)")
                        print(f"    unzipped : {unzipped / 1048576:.1f} MB (limit 750 MB)")

                        if entrypoint not in names:
                            print(f"ERROR: {entrypoint} is not at the root of the archive.")
                            print("AgentCore runs the entrypoint from the archive root.")
                            sys.exit(1)
                        print(f"    entrypoint at root: {entrypoint}")

                        if not any("/" in n and not n.startswith(".") for n in names):
                            print("ERROR: the archive has no dependency directories.")
                            print("AgentCore does not install dependencies; they must be in the zip.")
                            sys.exit(1)

                        if zipped > MAX_ZIPPED:
                            print("ERROR: archive exceeds the 250 MB zipped limit.")
                            sys.exit(1)
                        if unzipped > MAX_UNZIPPED:
                            print("ERROR: archive exceeds the 750 MB unzipped limit.")
                            sys.exit(1)

                        digest = hashlib.sha256()
                        with open(zip_path, "rb") as handle:
                            for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                                digest.update(chunk)
                        sha256 = digest.hexdigest()

                        # A build-scoped key keeps every deploy traceable and lets the
                        # deploy step point the runtime at this exact artifact.
                        key = f"{runtime_name}-{build_id}.zip"
                        if prefix:
                            key = f"{prefix}/{key}"

                        s3 = boto3.client("s3")
                        try:
                            with open(zip_path, "rb") as handle:
                                s3.put_object(
                                    Bucket=bucket,
                                    Key=key,
                                    Body=handle.read(),
                                    ExpectedBucketOwner=account_id,
                                )
                        except ClientError as exc:
                            print(f"ERROR: upload to s3://{bucket}/{key} failed -- {exc}")
                            sys.exit(1)

                        print(f"==> Uploaded s3://{bucket}/{key}")
                        print(f"    sha256: {sha256}")

                        with open("/tmp/package-outputs.env", "w", encoding="utf-8") as handle:
                            handle.write(f"CODE_OBJECT_KEY={key}\n")
                            handle.write(f"ZIP_SIZE={zipped}\n")
                            handle.write(f"ZIP_SHA256={sha256}\n")
                        PYEOF

                        python /tmp/package.py

                        set -a
                        . /tmp/package-outputs.env
                        set +a
                        export CODE_OBJECT_KEY ZIP_SIZE ZIP_SHA256

                        if [[ ! "$EXECUTION_ROLE_ARN" == arn:aws:iam::* ]]; then
                          echo "ERROR: executionRoleArn is not an IAM role ARN: $EXECUTION_ROLE_ARN"
                          exit 1
                        fi
                - step:
                    name: Deploy Agent Runtime
                    identifier: deploy_agent
                    type: Run
                    spec:
                      image: python:3.12-slim
                      shell: Bash
                      envVariables:
                        AWS_ACCESS_KEY_ID: <+secrets.getValue("aws_access_key_id")>
                        AWS_SECRET_ACCESS_KEY: <+secrets.getValue("aws_secret_access_key")>
                        AWS_SESSION_TOKEN: <+secrets.getValue("aws_session_token")>
                        AWS_DEFAULT_REGION: <+pipeline.variables.awsRegion>
                        AWS_ACCOUNT_ID: <+pipeline.variables.awsAccountId>
                        CODE_BUCKET: <+pipeline.variables.codeBucket>
                        CODE_OBJECT_KEY: <+steps.package_and_upload.output.outputVariables.CODE_OBJECT_KEY>
                        RUNTIME_NAME: <+pipeline.variables.runtimeName>
                        PYTHON_RUNTIME: <+pipeline.variables.pythonRuntime>
                        ENTRYPOINT: <+pipeline.variables.entrypoint>
                        USE_OTEL: <+pipeline.variables.useOtel>
                        EXECUTION_ROLE_ARN: <+pipeline.variables.executionRoleArn>
                        NETWORK_MODE: <+pipeline.variables.networkMode>
                        IDLE_SESSION_TIMEOUT: <+pipeline.variables.idleRuntimeSessionTimeout>
                        MAX_LIFETIME: <+pipeline.variables.maxLifetime>
                        AI_PORTKEY_API_KEY: <+secrets.getValue("ai_portkey_api_key")>
                        AI_GROQ_API_KEY: <+secrets.getValue("ai_groq_api_key")>
                        AI_LLM_MODEL: <+pipeline.variables.llmModel>
                        AI_LLM_PROVIDER: <+pipeline.variables.llmProvider>
                        CI: "true"
                      outputVariables:
                        - name: RUNTIME_ARN
                          type: String
                          value: RUNTIME_ARN
                        - name: RUNTIME_ID
                          type: String
                          value: RUNTIME_ID
                        - name: RUNTIME_STATUS
                          type: String
                          value: RUNTIME_STATUS
                        - name: DEPLOY_ACTION
                          type: String
                          value: DEPLOY_ACTION
                      command: |
                        set -euo pipefail

                        # ── Normalize AWS credentials (see Validate step) ─
                        AWS_ACCESS_KEY_ID="$(printf '%s' "${AWS_ACCESS_KEY_ID:-}" | tr -d '[:space:]')"
                        AWS_SECRET_ACCESS_KEY="$(printf '%s' "${AWS_SECRET_ACCESS_KEY:-}" | tr -d '[:space:]')"
                        AWS_SESSION_TOKEN="$(printf '%s' "${AWS_SESSION_TOKEN:-}" | tr -d '[:space:]')"
                        export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
                        case "$AWS_ACCESS_KEY_ID" in
                          AKIA*) unset AWS_SESSION_TOKEN ;;
                          *) [ -z "$AWS_SESSION_TOKEN" ] && unset AWS_SESSION_TOKEN || export AWS_SESSION_TOKEN ;;
                        esac

                        pip install --quiet --root-user-action=ignore boto3

                        cat > /tmp/deploy.py << 'PYEOF'
                        import hashlib
                        import json
                        import os
                        import sys
                        import time

                        import boto3
                        from botocore.exceptions import ClientError

                        region = os.environ["AWS_DEFAULT_REGION"]
                        account_id = os.environ["AWS_ACCOUNT_ID"]
                        runtime_name = os.environ["RUNTIME_NAME"]
                        entrypoint = os.environ["ENTRYPOINT"]
                        use_otel = os.environ.get("USE_OTEL", "true").lower() == "true"

                        # opentelemetry-instrument only belongs in the entrypoint when
                        # aws-opentelemetry-distro is inside the zip.
                        entry_point = (
                            ["opentelemetry-instrument", entrypoint] if use_otel else [entrypoint]
                        )

                        artifact = {
                            "codeConfiguration": {
                                "code": {
                                    "s3": {
                                        "bucket": os.environ["CODE_BUCKET"],
                                        "prefix": os.environ["CODE_OBJECT_KEY"],
                                    }
                                },
                                "runtime": os.environ["PYTHON_RUNTIME"],
                                "entryPoint": entry_point,
                            }
                        }

                        common = {
                            "agentRuntimeArtifact": artifact,
                            "roleArn": os.environ["EXECUTION_ROLE_ARN"],
                            "networkConfiguration": {
                                "networkMode": os.environ.get("NETWORK_MODE", "PUBLIC")
                            },
                            "lifecycleConfiguration": {
                                "idleRuntimeSessionTimeout": int(os.environ["IDLE_SESSION_TIMEOUT"]),
                                "maxLifetime": int(os.environ["MAX_LIFETIME"]),
                            },
                        }

                        # ── AGENT-SPECIFIC ───────────────────────────────
                        # AGENT_ENV_VARS are forwarded to the deployed runtime;
                        # REQUIRED_ENV_VARS are the ones the deploy fails without.
                        # Replace both lists to match your own agent, keeping them
                        # in sync with the envVariables above.
                        AGENT_ENV_VARS = (
                            "AI_PORTKEY_API_KEY",
                            "AI_GROQ_API_KEY",
                            "AI_LLM_MODEL",
                            "AI_LLM_PROVIDER",
                        )
                        REQUIRED_ENV_VARS = ("AI_PORTKEY_API_KEY", "AI_GROQ_API_KEY")
                        # ── end AGENT-SPECIFIC ───────────────────────────

                        # Values are stripped because a trailing newline in a
                        # secret reaches the model provider verbatim and comes
                        # back as an opaque 401 at the agent's first invocation.
                        env_vars = {
                            name: os.environ[name].strip()
                            for name in AGENT_ENV_VARS
                            if os.environ.get(name, "").strip()
                        }

                        for required in REQUIRED_ENV_VARS:
                            if required not in env_vars:
                                print(f"ERROR: {required} is empty. Check the Harness secret.")
                                sys.exit(1)
                            raw = os.environ[required]
                            if raw != raw.strip():
                                print(f"    note: {required} had surrounding whitespace; trimmed.")
                            # A fingerprint makes a truncated or stale secret obvious
                            # without printing the value. Compare it against
                            # printf '%s' "$KEY" | shasum -a 256 locally.
                            digest = hashlib.sha256(env_vars[required].encode()).hexdigest()[:8]
                            print(
                                f"    {required}: {len(env_vars[required])} chars, "
                                f"sha256:{digest}"
                            )

                        # ── AGENT-SPECIFIC ───────────────────────────────
                        # Optional shape checks. A truncated key deploys fine and
                        # then fails at the first invocation with a 401 that says
                        # nothing about truncation, so it is worth asserting the
                        # prefix your provider uses.
                        if not env_vars["AI_GROQ_API_KEY"].startswith("gsk_"):
                            print("ERROR: AI_GROQ_API_KEY does not start with 'gsk_'; it is truncated.")
                            sys.exit(1)
                        # ── end AGENT-SPECIFIC ───────────────────────────

                        common["environmentVariables"] = env_vars

                        client = boto3.client("bedrock-agentcore-control", region_name=region)

                        def find_existing(name):
                            paginator_kwargs = {}
                            while True:
                                page = client.list_agent_runtimes(**paginator_kwargs)
                                for runtime in page.get("agentRuntimes", []):
                                    if runtime.get("agentRuntimeName") == name:
                                        return runtime
                                token = page.get("nextToken")
                                if not token:
                                    return None
                                paginator_kwargs = {"nextToken": token}

                        print(f"==> Looking for an existing runtime named {runtime_name}")
                        existing = find_existing(runtime_name)

                        printable = json.loads(json.dumps(common, default=str))
                        printable.pop("environmentVariables", None)
                        print("==> Runtime configuration:")
                        print(json.dumps(printable, indent=2))
                        if env_vars:
                            print(f"==> Environment variables passed: {sorted(env_vars)}")

                        action = "UPDATE" if existing else "CREATE"
                        try:
                            if existing:
                                runtime_id = existing["agentRuntimeId"]
                                print(f"==> Updating existing runtime {runtime_id}")
                                response = client.update_agent_runtime(
                                    agentRuntimeId=runtime_id, **common
                                )
                            else:
                                print("==> Creating a new runtime")
                                response = client.create_agent_runtime(
                                    agentRuntimeName=runtime_name,
                                    description="Deployed via Harness CI (direct code deployment)",
                                    **common,
                                )
                        except ClientError as exc:
                            print(f"ERROR: {action} failed -- {exc}")
                            sys.exit(1)

                        runtime_arn = response["agentRuntimeArn"]
                        runtime_id = runtime_arn.split("/")[-1]
                        print(f"==> {action} accepted")
                        print(f"    ARN    : {runtime_arn}")
                        print(f"    status : {response.get('status')}")

                        TERMINAL_OK = {"READY"}
                        TERMINAL_BAD = {"CREATE_FAILED", "UPDATE_FAILED", "DELETING", "DELETE_FAILED"}
                        deadline = time.time() + 900

                        status = response.get("status", "UNKNOWN")
                        while time.time() < deadline and status not in TERMINAL_OK | TERMINAL_BAD:
                            time.sleep(15)
                            described = client.get_agent_runtime(agentRuntimeId=runtime_id)
                            status = described.get("status", "UNKNOWN")
                            print(f"    status : {status}")

                        with open("/tmp/deploy-outputs.env", "w", encoding="utf-8") as handle:
                            handle.write(f"RUNTIME_ARN={runtime_arn}\n")
                            handle.write(f"RUNTIME_ID={runtime_id}\n")
                            handle.write(f"RUNTIME_STATUS={status}\n")
                            handle.write(f"DEPLOY_ACTION={action}\n")

                        if status in TERMINAL_BAD:
                            print(f"ERROR: runtime ended in {status}")
                            sys.exit(1)

                        if status not in TERMINAL_OK:
                            print(f"ERROR: runtime still {status} after 15 minutes")
                            sys.exit(1)

                        print("==> Runtime is READY")
                        PYEOF

                        python /tmp/deploy.py

                        set -a
                        . /tmp/deploy-outputs.env
                        set +a
                        export RUNTIME_ARN RUNTIME_ID RUNTIME_STATUS DEPLOY_ACTION
                - step:
                    name: Smoke Test
                    identifier: smoke_test
                    type: Run
                    spec:
                      image: python:3.12-slim
                      shell: Bash
                      envVariables:
                        AWS_ACCESS_KEY_ID: <+secrets.getValue("aws_access_key_id")>
                        AWS_SECRET_ACCESS_KEY: <+secrets.getValue("aws_secret_access_key")>
                        AWS_SESSION_TOKEN: <+secrets.getValue("aws_session_token")>
                        AWS_DEFAULT_REGION: <+pipeline.variables.awsRegion>
                        RUNTIME_ARN: <+steps.deploy_agent.output.outputVariables.RUNTIME_ARN>
                        SMOKE_PROMPT: <+pipeline.variables.smokePrompt>
                        CI: "true"
                      command: |
                        set -euo pipefail

                        # ── Normalize AWS credentials (see Validate step) ─
                        AWS_ACCESS_KEY_ID="$(printf '%s' "${AWS_ACCESS_KEY_ID:-}" | tr -d '[:space:]')"
                        AWS_SECRET_ACCESS_KEY="$(printf '%s' "${AWS_SECRET_ACCESS_KEY:-}" | tr -d '[:space:]')"
                        AWS_SESSION_TOKEN="$(printf '%s' "${AWS_SESSION_TOKEN:-}" | tr -d '[:space:]')"
                        export AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
                        case "$AWS_ACCESS_KEY_ID" in
                          AKIA*) unset AWS_SESSION_TOKEN ;;
                          *) [ -z "$AWS_SESSION_TOKEN" ] && unset AWS_SESSION_TOKEN || export AWS_SESSION_TOKEN ;;
                        esac

                        pip install --quiet --root-user-action=ignore boto3

                        cat > /tmp/smoke.py << 'PYEOF'
                        import json
                        import os
                        import sys
                        import time
                        import uuid

                        import boto3
                        from botocore.exceptions import ClientError

                        runtime_arn = os.environ["RUNTIME_ARN"]
                        prompt = os.environ.get("SMOKE_PROMPT") or "Hello, are you there?"

                        # runtimeSessionId must be at least 33 characters.
                        session_id = f"harness-{int(time.time())}-{uuid.uuid4().hex}"

                        print(f"==> Invoking {runtime_arn}")
                        print(f"==> Session {session_id}")

                        client = boto3.client("bedrock-agentcore")

                        try:
                            response = client.invoke_agent_runtime(
                                agentRuntimeArn=runtime_arn,
                                runtimeSessionId=session_id,
                                contentType="application/json",
                                accept="application/json",
                                payload=json.dumps({"prompt": prompt}).encode("utf-8"),
                            )
                        except ClientError as exc:
                            code = exc.response["Error"]["Code"]
                            print(f"ERROR: invoke failed ({code}) -- {exc}")

                            if code == "RuntimeClientError":
                                # The runtime is up; the agent itself returned 4xx/5xx.
                                runtime_id = runtime_arn.split("/")[-1]
                                print(
                                    "The agent was reached but returned an error, so this is a "
                                    "problem in the agent, not in the deployment."
                                )
                                print(
                                    "Logs: /aws/bedrock-agentcore/runtimes/"
                                    f"{runtime_id}-DEFAULT"
                                )
                                print(
                                    "A 401 from the model gateway usually means the credential "
                                    "environment variables are wrong."
                                )
                                sys.exit(1)

                            if code in {"ThrottlingException", "RetryableConflictException"}:
                                print("Transient; retry the smoke test.")
                                sys.exit(0)

                            print("A newly created runtime can take several minutes to serve traffic.")
                            sys.exit(0)

                        body = response["response"].read().decode("utf-8", errors="replace")
                        print("==> Response:")
                        print(body)

                        if not body.strip():
                            print("WARNING: empty response -- smoke test inconclusive.")
                            sys.exit(0)

                        print("==> Smoke test passed.")
                        PYEOF

                        python /tmp/smoke.py
