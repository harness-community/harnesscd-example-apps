service:
  name: helm-kustomize-labels-svc
  identifier: helm_kustomize_labels_svc
  orgIdentifier: <+input>
  projectIdentifier: <+input>
  description: >-
    Helm K8s service that uses a Kustomize post-renderer to inject standard
    labels onto every deployed resource without modifying the Helm chart.
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: demo_chart
            type: HelmChart
            spec:
              store:
                type: Github
                spec:
                  connectorRef: <+input>        # your GitHub connector
                  gitFetchType: Branch
                  folderPath: helm-kustomize-labels/chart   # path to Chart.yaml in your repo
                  branch: main
              chartName: ""
              helmVersion: V3
              skipResourceVersioning: false
              enableDeclarativeRollback: false
              commandFlags:
                # The post-renderer must exist on the delegate before running.
                # See delegate-setup/post-render.sh for the script and setup instructions.
                - commandType: Template
                  flag: --post-renderer /opt/harness-delegate/client-tools/post-render.sh
                - commandType: Install
                  flag: --post-renderer /opt/harness-delegate/client-tools/post-render.sh
                - commandType: Upgrade
                  flag: --post-renderer /opt/harness-delegate/client-tools/post-render.sh
  gitOpsEnabled: false
