pipeline:
  name: Helm Deploy with Kustomize Label Injection
  identifier: helm_kustomize_labels
  projectIdentifier: <+input>
  orgIdentifier: <+input>
  tags:
    example: helm-kustomize-post-renderer
    category: custom-usecase
  stages:
    - stage:
        name: Deploy with Label Injection
        identifier: deploy_with_labels
        description: >-
          Deploys a GitHub-sourced Helm chart using a Kustomize post-renderer
          that injects standard labels onto every K8s resource without modifying
          the chart itself.
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: <+input>
          environment:
            environmentRef: <+input>
            deployToAll: false
            infrastructureDefinitions:
              - identifier: <+input>
          execution:
            steps:
              - step:
                  type: K8sRollingDeploy
                  name: Rolling Deployment
                  identifier: rollingDeployment
                  spec:
                    skipDryRun: false
                    pruningEnabled: false
                  timeout: 10m

              - step:
                  type: ShellScript
                  name: Verify Injected Labels
                  identifier: verify_labels
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |-
                          #!/bin/bash
                          NAMESPACE="<+infra.namespace>"

                          echo "========================================="
                          echo "KUBERNETES RESOURCE LABELS VERIFICATION"
                          echo "========================================="

                          echo -e "\n1. All resources with labels:"
                          kubectl get deploy,svc,pod -n $NAMESPACE --show-labels

                          echo -e "\n2. Deployment label block:"
                          kubectl get deploy -n $NAMESPACE \
                            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{.metadata.labels}{"\n\n"}{end}'

                          echo -e "\n3. Pod label block (confirms labels reached pod template):"
                          kubectl get pod -n $NAMESPACE \
                            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{.metadata.labels}{"\n\n"}{end}'

                          echo -e "\n========================================="
                          echo "✅ Labels verified on all resources"
                          echo "========================================="
                    environmentVariables: []
                    outputVariables: []
                  timeout: 5m

            rollbackSteps:
              - step:
                  name: Rollback Rolling Deployment
                  identifier: rollbackRollout
                  type: K8sRollingRollback
                  timeout: 10m
                  spec:
                    pruningEnabled: false

        tags: {}
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: StageRollback
