template:
  name: Helm Label Injection via Kustomize Post-Renderer
  identifier: kustomize_labels_helm
  versionLabel: v1
  type: Pipeline
  tags:
    category: custom-usecase
    topic: helm-label-injection
  spec:
    variables:
      - name: labelValue
        type: String
        description: >-
          Label value for 'runtime-label' on all deployed K8s resources.
          Leave blank to retain the label from the last deployment (or 'unspecified' on first run).
        value: <+input>.default("")
    stages:
      - stage:
          name: Deploy with Runtime Label
          identifier: deploy_with_runtime_label
          type: Deployment
          spec:
            deploymentType: Kubernetes
            service:
              serviceRef: <+input>
            environment:
              environmentRef: <+input>
              deployToAll: false
              infrastructureDefinitions:
                - identifier: <+input>
            execution:
              steps:
                - step:
                    type: ShellScript
                    name: Setup Post-Renderer on Delegate
                    identifier: setup_post_renderer
                    spec:
                      shell: Bash
                      onDelegate: true
                      source:
                        type: Inline
                        spec:
                          script: |-
                            #!/bin/bash
                            set -euo pipefail

                            TOOLS=/opt/harness-delegate/client-tools
                            NAMESPACE="<+infra.namespace>"
                            PROVIDED="<+pipeline.variables.labelValue>"

                            echo "=== Step 1: Resolve effective label value ==="
                            if [ -z "$PROVIDED" ]; then
                              echo "labelValue is blank — reading current label from cluster..."
                              EFFECTIVE=$(kubectl get deployment -n "$NAMESPACE" \
                                -o "jsonpath={.items[0].metadata.labels['runtime-label']}" 2>/dev/null || true)
                              if [ -z "$EFFECTIVE" ]; then
                                echo "No existing label found — defaulting to 'unspecified'"
                                EFFECTIVE="unspecified"
                              else
                                echo "Retaining existing label: $EFFECTIVE"
                              fi
                            else
                              EFFECTIVE="$PROVIDED"
                              echo "Using provided label: $EFFECTIVE"
                            fi
                            echo "$EFFECTIVE" > /tmp/harness-runtime-label
                            echo "Effective label: $EFFECTIVE"

                            echo ""
                            echo "=== Step 2: Install kustomize if missing ==="
                            ARCH=$(uname -m)
                            case "$ARCH" in
                              aarch64|arm64) GOARCH="arm64" ;;
                              *) GOARCH="amd64" ;;
                            esac
                            echo "Delegate arch: $ARCH -> $GOARCH"
                            [ -d "$TOOLS/kustomize" ] && rm -rf "$TOOLS/kustomize"
                            if ! "$TOOLS/kustomize" version &>/dev/null 2>&1; then
                              echo "Installing kustomize v5.4.3 (linux/$GOARCH)..."
                              curl -sSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_${GOARCH}.tar.gz" \
                                | tar -xzf - -C /tmp/
                              install -m 0755 /tmp/kustomize "$TOOLS/kustomize"
                              rm -f /tmp/kustomize
                            fi
                            echo "kustomize: $("$TOOLS/kustomize" version)"

                            echo ""
                            echo "=== Step 3: Write post-render-runtime.sh ==="
                            cat > "$TOOLS/post-render-runtime.sh" << 'SCRIPT_EOF'
                            #!/usr/bin/env bash
                            # Helm post-renderer: injects runtime labels via kustomize.
                            # $1 = label value (passed via helm --post-renderer-args).
                            # Falls back to /tmp/harness-runtime-label written by setup step.
                            set -euo pipefail
                            KUSTOMIZE=/opt/harness-delegate/client-tools/kustomize
                            LABEL_VALUE="${1:-}"
                            [ -z "$LABEL_VALUE" ] && LABEL_VALUE=$(cat /tmp/harness-runtime-label 2>/dev/null || echo "unspecified")
                            WORK=$(mktemp -d)
                            trap 'rm -rf "$WORK"' EXIT
                            cat > "$WORK/all.yaml"
                            {
                              printf '%s\n' 'apiVersion: kustomize.config.k8s.io/v1beta1'
                              printf '%s\n' 'kind: Kustomization'
                              printf '%s\n' 'resources:'
                              printf '%s\n' '  - all.yaml'
                              printf '%s\n' 'labels:'
                              printf '%s\n' '  - includeSelectors: false'
                              printf '%s\n' '    includeTemplates: true'
                              printf '%s\n' '    pairs:'
                              printf '      runtime-label: %s\n' "$LABEL_VALUE"
                              printf '%s\n' '      managed-by: harness'
                            } > "$WORK/kustomization.yaml"
                            "$KUSTOMIZE" build "$WORK"
                            SCRIPT_EOF

                            chmod +x "$TOOLS/post-render-runtime.sh"
                            echo "post-render-runtime.sh installed at $TOOLS/post-render-runtime.sh"

                            echo ""
                            echo "=== Smoke test ==="
                            echo 'apiVersion: v1
                            kind: ConfigMap
                            metadata:
                              name: smoke-test' | "$TOOLS/post-render-runtime.sh" smoke-label
                      environmentVariables: []
                      outputVariables: []
                    timeout: 5m

                - step:
                    type: K8sRollingDeploy
                    name: Rolling Deploy
                    identifier: rolling_deploy
                    spec:
                      skipDryRun: false
                      pruningEnabled: false
                    timeout: 10m

              rollbackSteps:
                - step:
                    name: Rollback
                    identifier: rollback
                    type: K8sRollingRollback
                    timeout: 10m
                    spec:
                      pruningEnabled: false
          tags: {}
          failureStrategies:
            - onFailure:
                errors:
                  - AllErrors
                action:
                  type: StageRollback
